body{font-family:'Barlow Semi Condensed',sans-serif;color:var(--ink);background:

#searchM{flex:1;min-width:160px;border:2px solid var(--shadow);border-radius:8px;padding:7px 10px;font:inherit;background:#fff}

#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:999999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}

@keyframes pop{from{transform:scale(.7);opacity:0}}

.modal.open{display:flex}

.sect{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}

.topbar{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;

const KEY='superTycoonV2';
function loadState(){ try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;} }
let S=loadState()||{};
if(!S||S.started!==true||S.setupComplete!==true){
 window.location.replace('mi_ciudad.html');
 throw new Error('No hay partida iniciada. Empieza una partida en mi_ciudad.html.');
}
applyDefaults();

const $=id=>document.getElementById(id);

function save(){localStorage.setItem(KEY,JSON.stringify(S));}

function updateHUD(){
 if(!S || !S.wallet) return;
 $('tbWallet').textContent='€'+S.wallet.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
 $('tbEnergy').firstElementChild.style.width=(S.energy||100)+'%';
 $('tbMood').textContent=(S.mood||70)>=80?'😄':(S.mood||70)>=55?'😊':(S.mood||70)>=30?'😐':(S.mood||70)>=15?'😟':'😭';
 $('tbDay').textContent=S.day||1;
 const h=Math.floor((S.clockMin||0)/60),m=(S.clockMin||0)%60;
 $('tbClock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
 $('tbMode').textContent=S.mode==='online'?'🌐 Online-Multijugador':'🤖 Offline-CPU';

/* ================= FIREBASE ================= */
const FIREBASE_CONFIG={apiKey:"AIzaSyAonZFfeUCTELdFUhQrPADOPafFA0_Tzeg",authDomain:"juegobarrio-fbe55.firebaseapp.com",projectId:"juegobarrio-fbe55"};
const FB_OK = typeof firebase!=='undefined' && !FIREBASE_CONFIG.apiKey.startsWith('TU_');
const FB={db:null,uid:null,pname:null,room:null,online:false,marketCache:{}};
const ROOM=S.room||'barrio-1';

function initFirebase(){
 if(!FB_OK || S.mode!=='online') return;
 try{ if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);}catch(e){}
 firebase.auth().signInAnonymously().then(cr=>{
  FB.uid=cr.user.uid;
  FB.pname=S.pname||'Jugador';
  FB.room=ROOM;
  FB.db=firebase.firestore();
  FB.online=true;
  $('tbMode').textContent='🌐 Online-Multijugador';
  FB.db.collection('rooms').doc(ROOM).collection('marketOffers').onSnapshot(snap=>{
   FB.marketCache={};
   snap.forEach(doc=>{
    const d=doc.data();
    if(!d || !d.pid) return;
    if(d.uid===FB.uid) return;
    if(!FB.marketCache[d.pid]) FB.marketCache[d.pid]={sellers:[],buyers:[]};
    if(d.kind==='sell'){
     FB.marketCache[d.pid].sellers.push({
      name:d.pname||'Jugador',
      loc:d.location||'Comercio online',
      qty:d.qty||1,
      price:d.price||0,
      isPlayer:true,
      uid:d.uid
     });
    } else if(d.kind==='buy'){
     FB.marketCache[d.pid].buyers.push({
      name:d.pname||'Jugador',
      loc:d.location||'Comercio online',
      qty:d.qty||1,
      price:d.price||0,
      isPlayer:true,
      uid:d.uid
     });
    }
   });
   if($('detailModal').classList.contains('open') && CURRENT_DETAIL_ID!==null){
    openDetail('product',CURRENT_DETAIL_ID);
   }
  },()=>{});
  FB.db.collection('rooms').doc(ROOM).collection('players').doc(FB.uid).set({
   name:FB.pname, level:S.level||1, lastSeen:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true}).catch(()=>{});
  setInterval(()=>{
   if(!FB.db) return;
   FB.db.collection('rooms').doc(ROOM).collection('players').doc(FB.uid).set({
    name:FB.pname, level:S.level||1, lastSeen:firebase.firestore.FieldValue.serverTimestamp()
   },{merge:true}).catch(()=>{});
  },25000);
 }).catch(()=>{FB.online=false;});
}

function hashProduct(id,salt){
 let h=id*2654435761+salt*40503;h=((h>>16)^h)*2654435761;h=h>>>0;return h/4294967296;
}

function generateMarket(id){
 const p=byId[id];if(!p)return{sellers:[],buyers:[]};
 const rand=seed=>hashProduct(id,seed);
 const sellers=[];const buyers=[];

 const cache=FB.marketCache&&FB.marketCache[id];
 let playerSellers=0, playerBuyers=0;
 if(FB.online && cache){
  (cache.sellers||[]).forEach(s=>{
   sellers.push({
    name:s.name, loc:s.loc, qty:s.qty, price:s.price,
    isPlayer:true, uid:s.uid
   });
   playerSellers++;
  });
  (cache.buyers||[]).forEach(b=>{
   buyers.push({
    name:b.name, loc:b.loc, qty:b.qty, price:b.price,
    isPlayer:true, uid:b.uid
   });
   playerBuyers++;
  });
 }

 const MIN_SELLERS_ONLINE=4;
 const MIN_BUYERS_ONLINE=3;
 const MIN_SELLERS_OFFLINE=5+Math.floor(rand(101)*3);
 const MIN_BUYERS_OFFLINE=4+Math.floor(rand(202)*3);

 const targetSellers = FB.online ? Math.max(2, MIN_SELLERS_ONLINE - playerSellers) : MIN_SELLERS_OFFLINE;
 const targetBuyers  = FB.online ? Math.max(2, MIN_BUYERS_ONLINE  - playerBuyers)  : MIN_BUYERS_OFFLINE;

 const usedIdxS=new Set();
 const usedIdxB=new Set();
 const pickUnique=(usedSet,seed)=>{
  let idx=Math.floor(rand(seed)*NPC_PLAYERS.length);
  let tries=0;
  while(usedSet.has(idx) && tries++<50){
   idx=(idx+1)%NPC_PLAYERS.length;
  }
  usedSet.add(idx);
  return idx;
 };

 for(let i=0;i<targetSellers;i++){
  const idx=pickUnique(usedIdxS,300+i);
  const name=NPC_PLAYERS[idx];
  const loc=MARKET_LOCATIONS[Math.floor(rand(400+i)*MARKET_LOCATIONS.length)];
  const qty=5+Math.floor(rand(600+i)*Math.max(5,p.fair*4));
  const price=r2(p.fair*(0.9+rand(700+i)*0.5));
  sellers.push({name,loc,qty,price,isPlayer:false});
 }
 for(let i=0;i<targetBuyers;i++){
  const idx=pickUnique(usedIdxB,800+i);
  const name=NPC_PLAYERS[idx];
  const loc=MARKET_LOCATIONS[Math.floor(rand(900+i)*MARKET_LOCATIONS.length)];
  const qty=5+Math.floor(rand(1100+i)*Math.max(5,p.fair*3));
  const price=r2(p.fair*(0.6+rand(1200+i)*0.35));
  buyers.push({name,loc,qty,price,isPlayer:false});
 }

 sellers.sort((a,b)=>a.price-b.price);
 buyers.sort((a,b)=>b.price-a.price);
 return{sellers,buyers};
}

function generatePriceHistory(id){
 const p=byId[id];if(!p)return[];
 const out=[];
 for(let i=1;i<=7;i++){
  const r=hashProduct(id,2000+i);
  const price=r2(p.fair*(0.8+r*0.6));
  out.push({day:i,price});
 }
 return out;
}

/* ================= ECONOMÍA ================= */
const totalStock=()=>{let t=0;for(const k in S.stock)t+=S.stock[k];return t;};
const cap=()=>250+(S.up.shelf||0)*150+(S.vanLv||0)*40;
const mkCost=id=>{const p=byId[id];const base=(S.mk[id]??p.cost)||p.fair||1;return Math.max(.01,r2(base*(1-.04*(S.up.sup||0))*((S.event&&S.event.price)||1)));};
const priceOf=id=>S.prices[id]??byId[id].fair;
function addStock(pid,q){S.stock[pid]=(S.stock[pid]||0)+q;if(S.prices[pid]===undefined)S.prices[pid]=byId[pid].fair;}
function logEconomy(kind,text,amount=0,actor='Sistema'){S.econLog=S.econLog||[];S.econLog.unshift({day:S.day,clock:S.clockMin,kind,text,amount,actor});if(S.econLog.length>80)S.econLog.length=80;save();}

function buy(id,q,fill){
 const c=mkCost(id),space=cap()-totalStock();
 if(space<=0){toast('📦 ¡Almacén lleno!');return false;}
 if(fill)q=space;
 q=Math.min(q,space,Math.floor((S.cash||0)/c));
 if(q<=0){toast('💸 No te llega el dinero de la caja.');return false;}
 const total=r2(c*q);S.cash-=total;S.dd.buy+=total;S.tot.buy+=total;
 addStock(id,q);logEconomy('Compra',`Compra de ${q} unidades de ${byId[id].name}`,total,'Mercado');
 toast(`✅ Comprados ${q}× ${byId[id].name}`);save();updateHUD();
 return true;
}

}

function buyOfferLocal(id){
 const o=(S.offers||[]).find(x=>x.id===id);if(!o)return;
 if((S.cash||0)<o.price){toast('🏪 La caja no llega.');return;}
 if(o.qty>cap()-totalStock()){toast('📦 Almacén lleno.');return;}
 S.cash-=o.price;addStock(o.pid,o.qty);S.offers=S.offers.filter(x=>x.id!==id);
 logEconomy('Broker',`Compra de lote: ${o.qty} unidades de ${byId[o.pid].name}`,o.price,o.name);
 toast(`🤝 Lote comprado a ${o.name}: ${o.qty}× ${byId[o.pid].name}`);
 save();updateHUD();renderBroker();
}

/* ================= MODAL DETALLE ================= */
function openDetail(kind,id){
 const card=$('detailCard');
 if(kind!=='product')return;
 const p=byId[+id];if(!p)return;
 CURRENT_DETAIL_ID=+id;
 const market=generateMarket(p.id);
 const history=generatePriceHistory(p.id);
 const stock=S.stock[p.id]||0;

 const sellerRows=market.sellers.map((s,i)=>`
  <tr>
   <td class="col-qty">${s.qty.toLocaleString('es-ES')}</td>
   <td class="col-price price-buy">${fmt$(s.price)}</td>
   <td class="location">${s.loc} · ${s.name}${s.isPlayer?'<span class="source-badge source-player">Jugador</span>':'<span class="source-badge source-npc">NPC</span>'}</td>
   <td class="col-actions"><button class="btn buy-blue" data-buy-seller="${p.id}" data-idx="${i}">Comprar</button></td>
  </tr>`).join('');
 const buyerRows=market.buyers.map((b,i)=>`
  <tr>
   <td class="col-qty">${b.qty.toLocaleString('es-ES')}</td>
   <td class="col-price price-sell">${fmt$(b.price)}</td>
   <td class="location">${b.loc} · ${b.name}${b.isPlayer?'<span class="source-badge source-player">Jugador</span>':'<span class="source-badge source-npc">NPC</span>'}</td>
   <td class="col-actions"><button class="btn sell-green" data-sell-buyer="${p.id}" data-idx="${i}">Vender</button></td>
  </tr>`).join('');

 const historyRows=history.map(h=>`<div class="price-history-row"><span>Día ${h.day}</span><span class="price-buy">${fmt$(h.price)}</span></div>`).join('');

 const onlineBadge = FB.online
   ? '<span class="source-badge source-player">🌐 Online</span>'
   : '<span class="source-badge source-npc">🤖 CPU</span>';

 card.innerHTML=`
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
   <div style="font-size:2.6rem;line-height:1">${p.emoji}</div>
   <div style="flex:1;min-width:0">
    <h2 style="margin-bottom:2px">${p.name}</h2>
    <p style="margin:0;color:#6b6250;font-size:.85rem">${CATNAME[p.cat]} · Precio justo <b>${fmt$(p.fair)}</b> · En tu súper: <b>${stock} uds.</b> ${onlineBadge}</p>
   </div>
   <div style="text-align:right">
    <div style="font-family:'Bungee';font-size:1.05rem;color:#1e9e50">${fmt$(mkCost(p.id))}</div>
    <div style="font-size:.72rem;color:#8a7f68">Compra actual</div>
   </div>
  </div>

  <div class="mtabs">
   <div class="mtab active" data-mtab="data">Datos del mercado</div>
   <div class="mtab" data-mtab="hist">Historial de precios</div>
  </div>

  <div class="mtab-body active" data-mtab-body="data">
   <div class="market-section-title">📤 Vendedores</div>
   <table class="market-table">
    <thead><tr><th class="col-qty">Cantidad</th><th class="col-price">Precio</th><th>Ubicación</th><th class="col-actions"></th></tr></thead>
    <tbody>${sellerRows||'<tr><td colspan="4" style="text-align:center;padding:12px;color:#8a7f68">Sin vendedores</td></tr>'}</tbody>
   </table>

   <div class="market-section-title">📥 Compradores</div>
   <table class="market-table">
    <thead><tr><th class="col-qty">Cantidad</th><th class="col-price">Precio</th><th>Ubicación</th><th class="col-actions"></th></tr></thead>
    <tbody>${buyerRows||'<tr><td colspan="4" style="text-align:center;padding:12px;color:#8a7f68">Sin compradores</td></tr>'}</tbody>
   </table>

   <div class="sect" style="margin-top:10px"><h4>🛒 Compra directa (stock en tu súper)</h4>
    <div class="rowflex" id="detailQchips"></div>
    <div class="rowflex" style="margin-top:8px">
     <button class="btn grn" id="detailBuyBtn">Comprar ×${buyQty}</button>
     <button class="btn" id="detailFillBtn" title="Llenar">∞ Llenar</button>
    </div>
   </div>

   ${FB.online?`
    <div class="sect"><h4>📢 Publicar oferta online</h4>
     <div class="rowflex">
      <input id="pubPrice" type="number" min="0.01" step="0.01" placeholder="Precio/ud" style="width:110px">
      <input id="pubQty" type="number" min="1" value="10" style="width:90px">
      <button class="btn grn" id="pubSellBtn">Vender stock</button>
      <button class="btn" id="pubBuyBtn">Quiero comprar</button>
     </div>
     <p class="note" style="font-size:.75rem;color:#8a7f68;margin-top:5px">Publica tu oferta para que otros jugadores la vean en su Centro Comercial.</p>
    </div>`:''}
  </div>

  <div class="mtab-body" data-mtab-body="hist">
   <div class="market-section-title">📈 Historial de precios (7 días)</div>
   <div class="sect">${historyRows}</div>
  </div>

  <div style="text-align:right;margin-top:10px"><button class="btn ghost" id="closeDetailBtn">Cerrar ✖</button></div>
 `;
 $('detailModal').classList.add('open');

 card.querySelectorAll('.mtab').forEach(t=>{
  t.onclick=()=>{
   card.querySelectorAll('.mtab').forEach(x=>x.classList.remove('active'));
   card.querySelectorAll('.mtab-body').forEach(x=>x.classList.remove('active'));
   t.classList.add('active');
   card.querySelector(`[data-mtab-body="${t.dataset.mtab}"]`).classList.add('active');
  };
 });
 card.querySelectorAll('[data-buy-seller]').forEach(btn=>{
  btn.onclick=()=>{
   const idx=+btn.dataset.idx;
   const s=market.sellers[idx];
   if(!s)return;
   if((S.cash||0)<s.price){toast('🏪 La caja no llega.');return;}
   if(1>cap()-totalStock()){toast('📦 Almacén lleno.');return;}
   S.cash-=s.price;addStock(p.id,1);
   logEconomy('Broker',`Compra a ${s.name}: 1× ${p.name}`,s.price,s.name);
   toast(`✅ 1× ${p.name} comprado a ${s.name} por ${fmt$(s.price)}`);
   s.qty--;save();updateHUD();openDetail('product',id);
  };
 });
 card.querySelectorAll('[data-sell-buyer]').forEach(btn=>{
  btn.onclick=()=>{
   const idx=+btn.dataset.idx;
   const b=market.buyers[idx];
   if(!b)return;
   if((S.stock[p.id]||0)<1){toast('📦 No tienes stock de este producto.');return;}
   S.stock[p.id]--;
   if(S.stock[p.id]<=0)delete S.stock[p.id];
   S.cash+=b.price;
   logEconomy('Broker',`Venta a ${b.name}: 1× ${p.name}`,b.price,b.name);
   toast(`💰 1× ${p.name} vendido a ${b.name} por ${fmt$(b.price)}`);
   b.qty--;save();updateHUD();openDetail('product',id);
  };
 });
 const qc=card.querySelector('#detailQchips');
 if(qc){
  [10,50,200,500].forEach(qv=>{
   const bt=document.createElement('button');bt.className='qchip'+(qv===buyQty?' sel':'');bt.textContent='×'+qv;
   bt.onclick=()=>{buyQty=qv;qc.querySelectorAll('.qchip').forEach(x=>x.classList.remove('sel'));bt.classList.add('sel');card.querySelector('#detailBuyBtn').textContent='Comprar ×'+buyQty;};
   qc.appendChild(bt);
  });
  card.querySelector('#detailBuyBtn').onclick=()=>{if(buy(p.id,buyQty,false)){openDetail('product',id);renderBroker();}};
  card.querySelector('#detailFillBtn').onclick=()=>{if(buy(p.id,0,true)){openDetail('product',id);renderBroker();}};
 }
 card.querySelector('#pubSellBtn')?.addEventListener('click',()=>{
  const price=parseFloat(card.querySelector('#pubPrice').value);
  const qty=parseInt(card.querySelector('#pubQty').value,10)||1;
  if(!price||price<=0){toast('⚠️ Introduce un precio válido.');return;}
  if((S.stock[p.id]||0)<qty){toast('📦 No tienes suficiente stock.');return;}
  S.stock[p.id]-=qty;if(S.stock[p.id]<=0)delete S.stock[p.id];
  publishOfferToMarket(p.id,qty,price,'sell');
  toast(`📢 Oferta publicada: ${qty}× ${p.name} a ${fmt$(price)}`);
  save();updateHUD();openDetail('product',id);
 });
 card.querySelector('#pubBuyBtn')?.addEventListener('click',()=>{
  const price=parseFloat(card.querySelector('#pubPrice').value);
  const qty=parseInt(card.querySelector('#pubQty').value,10)||1;
  if(!price||price<=0){toast('⚠️ Introduce un precio válido.');return;}
  publishOfferToMarket(p.id,qty,price,'buy');
  toast(`📢 Demanda publicada: quieres ${qty}× ${p.name} a ${fmt$(price)}`);
  openDetail('product',id);
 });

 card.querySelector('#closeDetailBtn').onclick=()=>{$('detailModal').classList.remove('open');CURRENT_DETAIL_ID=null;};
}
$('detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal'){$('detailModal').classList.remove('open');CURRENT_DETAIL_ID=null;}});

/* ================= Chips cantidad y búsqueda ================= */
(function(){
 const qc=$('qchips');
 [10,50,200,500].forEach(qv=>{
  const b=document.createElement('button');b.className='qchip'+(qv===buyQty?' sel':'');b.textContent='×'+qv;
  b.onclick=()=>{buyQty=qv;qc.querySelectorAll('.qchip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
  qc.appendChild(b);
 });
})();
$('searchM').addEventListener('input',renderBroker);

function applyDefaults(){
 S.stock=S.stock||{};S.prices=S.prices||{};S.mk=S.mk||{};S.mkPrev=S.mkPrev||{};S.up=S.up||{shelf:0,sup:0};
 S.properties=S.properties||[];S.landBuildings=S.landBuildings||{};
 S.offers=S.offers||[];S.econLog=S.econLog||[];S.rel=S.rel||{};S.greeted=S.greeted||{};S.dd=S.dd||{buy:0};S.tot=S.tot||{buy:0};
}
setInterval(()=>{S=loadState()||S;applyDefaults();updateHUD();},5000);
updateHUD();renderBroker();
</script>
</body>
</html>
