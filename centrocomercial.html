<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperGanga Tycoon — Mercado-Broker</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2f22;--paper:#fdf7ea;--paper2:#f2e7cd;--ink:#26221c;--red:#d93a2b;--red2:#a92417;
--yellow:#ffcf3f;--green:#3ecf6f;--line:#e2d4b2;--shadow:#1e1a17}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow Semi Condensed',sans-serif;color:var(--ink);background:
 radial-gradient(1200px 500px at 50% -10%,#1b4a35 0%,transparent 60%),
 repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 2px,transparent 2px 26px),var(--bg);
 min-height:100vh;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}button{font-family:inherit;cursor:pointer;user-select:none}
.btn{border:2px solid var(--shadow);border-radius:8px;padding:6px 12px;font-weight:700;font-size:.88rem;
 box-shadow:0 3px 0 var(--shadow);transition:transform .1s;background:var(--yellow)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn.red{background:var(--red);color:#fff}.btn.ghost{background:#fff}.btn.grn{background:var(--green);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.panelhead{background:var(--paper);border:2px solid var(--shadow);border-radius:12px 12px 0 0;padding:12px 16px 8px}
.panelhead h2{font-family:'Bungee';font-size:1.15rem;color:var(--red)}
.panelhead p{font-size:.88rem;color:#6b6250;margin-top:4px;line-height:1.35}
.panelbody{background:var(--paper);border:2px solid var(--shadow);border-top:1px dashed var(--line);border-radius:0 0 12px 12px;padding:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
#searchM{flex:1;min-width:160px;border:2px solid var(--shadow);border-radius:8px;padding:7px 10px;font:inherit;background:#fff}
.qchip{border:2px solid var(--shadow);background:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:.83rem;box-shadow:0 3px 0 var(--shadow)}
.qchip.sel{background:var(--yellow)}
.emptybox{padding:28px;text-align:center;color:#8a7f68;background:#fff;border:2px dashed var(--line);border-radius:12px}
.toast{background:var(--shadow);color:#fff;padding:9px 18px;border-radius:10px;border:2px solid var(--yellow);font-weight:600;animation:pop .25s;max-width:92vw;text-align:center}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;align-items:center}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.modal{position:fixed;inset:0;z-index:10000;background:rgba(4,16,10,.78);display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.modal.open{display:flex}
.mcard{position:relative;z-index:10001;background:var(--paper);border:3px solid var(--shadow);border-radius:14px;max-width:520px;width:100%;padding:22px;
 box-shadow:0 10px 0 var(--shadow),0 24px 50px rgba(0,0,0,.5);animation:pop .3s;max-height:92vh;overflow-y:auto}
.mcard.wide{max-width:820px}
.mcard h2{font-family:'Bungee';color:var(--red);font-size:1.35rem;margin-bottom:8px}
.mcard p{margin-bottom:8px;line-height:1.35}
.sect{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.sect h4{font-family:'Bungee';font-size:.9rem;color:var(--red);margin-bottom:6px}
.orow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding:6px 0;font-size:.9rem;flex-wrap:wrap}
.orow:last-child{border:none}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.topbar{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
 padding:8px 12px;background:linear-gradient(#0c281c,#0a2217);border-bottom:3px solid #1d5a41}
.chip{background:#12382a;border:2px solid #1d5a41;color:#e9f5ec;border-radius:10px;padding:5px 11px;font-size:.92rem;
 display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.chip b{color:#fff}
.mini{width:64px;height:9px;background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.mini i{display:block;height:100%;transition:width .4s}
#tbEnergy i{background:linear-gradient(90deg,#ffb347,var(--yellow))}
/* ================= BROKER ================= */
.broker-layout{display:grid;grid-template-columns:210px 1fr;gap:14px}
.broker-categories{background:var(--paper2);border-radius:10px;padding:8px;border:2px solid var(--line);max-height:560px;overflow-y:auto}
.broker-categories .cat-item{padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.85rem;margin-bottom:2px;display:flex;align-items:center;gap:6px;transition:background .1s}
.broker-categories .cat-item:hover{background:#e6dcc8}
.broker-categories .cat-item.active{background:var(--yellow);color:var(--shadow)}
.broker-categories .cat-item .badge-cat{font-size:.7rem;background:rgba(0,0,0,.1);border-radius:10px;padding:0 6px;margin-left:auto}
.broker-table-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:10px;background:#fff}
.broker-table{width:100%;border-collapse:collapse;font-size:.82rem}
.broker-table th{background:var(--paper2);text-align:left;padding:6px 10px;border-bottom:2px solid var(--line);font-family:'Bungee';font-weight:400;font-size:.78rem;color:var(--ink)}
.broker-table td{padding:5px 10px;border-bottom:1px solid #eee;cursor:pointer;transition:background .1s}
.broker-table tr:hover td{background:#f5efe4}
.broker-table .col-emoji{width:30px;text-align:center}
.broker-table .col-name{min-width:120px}
.broker-table .col-cat{min-width:80px}
.broker-table .col-buy{min-width:80px;text-align:right}
.broker-table .col-sell{min-width:80px;text-align:right}
.broker-table .col-change{min-width:70px;text-align:right}
.broker-table .col-stock{min-width:60px;text-align:center}
.broker-table .trend-up{color:var(--green)}
.broker-table .trend-down{color:var(--red)}
.broker-table .trend-eq{color:#999}
.broker-table .badge-stock{background:var(--paper2);border-radius:4px;padding:0 6px;font-size:.7rem}
.broker-table .badge-stock.own{background:#c8e6c9}
.broker-table .badge-stock.est{background:#d4e0f0}
.land-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:2px}
.land-card{background:#f7f2e2;border:2px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;min-width:0}
.land-card h3{font-family:'Bungee';font-size:.78rem;color:var(--ink);line-height:1.25;min-height:2.4em;margin-bottom:4px}
.land-card .land-meta{font-size:.72rem;color:#6b6250;margin:1px 0}
.land-card .land-produce{font-size:.72rem;color:#5c5443;margin:5px 0;min-height:1.6em}
.land-card .land-desc{font-size:.7rem;color:#8a7f68;line-height:1.25;margin-bottom:6px;min-height:2.4em}
.land-card .land-price{font-family:'Bungee';font-size:.86rem;color:#1e9e50;margin:4px 0 8px}
.land-card .land-owned{font-size:.68rem;font-weight:700;color:#176d36;background:#eaffef;border:1px solid var(--green);border-radius:6px;padding:2px 6px;margin-bottom:6px;display:inline-block}
.land-card button{width:100%;background:#2e78e0;color:#fff;border-color:#173c2d;box-shadow:0 3px 0 #173c2d}
.land-card button:disabled{background:#9fb6cf}
.landcat-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.landcat-bar .lc-btn{font-size:.72rem;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer}
.landcat-bar .lc-btn.active{background:var(--red);color:#fff;border-color:var(--red2)}
@media(max-width:700px){.broker-layout{grid-template-columns:1fr}.broker-categories{max-height:200px;display:flex;flex-wrap:wrap;gap:4px}.broker-categories .cat-item{flex:0 0 auto;margin-bottom:0}}
</style>
</head>

/* ===== Economía de mercado ===== */
const totalStock=()=>{let t=0;for(const k in S.stock)t+=S.stock[k];return t;};
const cap=()=>250+(S.up.shelf||0)*150+(S.vanLv||0)*40;
const mkCost=id=>{const p=byId[id];const base=(S.mk[id]??p.cost)||p.fair||1;return Math.max(.01,r2(base*(1-.04*(S.up.sup||0))*(1-.06*(S.contracts[p.cat]||0))*((S.event&&S.event.price)||1)));};
const priceOf=id=>S.prices[id]??byId[id].fair;
function addStock(pid,q){S.stock[pid]=(S.stock[pid]||0)+q;if(S.prices[pid]===undefined)S.prices[pid]=byId[pid].fair;}
function logEconomy(kind,text,amount=0,actor='Sistema'){S.econLog=S.econLog||[];S.econLog.unshift({day:S.day,clock:S.clockMin,kind,text,amount,actor});if(S.econLog.length>80)S.econLog.length=80;save();}

function buy(id,q,fill){
 const c=mkCost(id),space=cap()-totalStock();
 if(space<=0){toast('📦 ¡Almacén lleno!');return false;}
 if(fill)q=space;
 q=Math.min(q,space,Math.floor((S.cash||0)/c));
 if(q<=0){toast('💸 No te llega el dinero de la caja.');return false;}
 const total=r2(c*q);S.cash-=total;S.dd.buy+=total;S.tot.buy+=total;
 addStock(id,q);logEconomy('Compra',`Compra de ${q} unidades de ${byId[id].name}`,total,'Mercado');
 toast(`✅ Comprados ${q}× ${byId[id].name}`);save();updateHUD();
 return true;
}

    <td class="col-emoji">${e.emoji}</td><td class="col-name">${e.name}</td><td class="col-cat">${e.type}</td>
    <td class="col-buy">${fmt$(e.cost)}</td><td class="col-sell">${own?'Propio':'Disponible'}</td>
    <td class="col-change">—</td><td class="col-stock"><span class="badge-stock est">${own?'✅':'📌'}</span></td></tr>`;
  });
  if(!rows)rows='<tr><td colspan="7" style="text-align:center;padding:20px;color:#8a7f68">No hay locales disponibles.</td></tr>';
  mainHtml=`<div class="broker-table-wrap"><table class="broker-table"><thead><tr>
   <th></th><th>Local</th><th>Categoría</th><th>Precio</th><th>Estado</th><th>—</th><th>Tuyo</th></tr></thead>
   <tbody>${rows}</tbody></table></div>`;
 } else if(currentCat==='_casas'){
  let rows='';
  BOTS.filter(b=>!q||norm(b.name).includes(q)).forEach(b=>{
   rows+=`<tr data-row-kind="house" data-row-id="${b.id}">
    <td class="col-emoji">${b.emoji}</td><td class="col-name">Casa de ${b.name}</td><td class="col-cat">Vecino</td>
    <td class="col-buy">—</td><td class="col-sell">Relación ${relOf(b)}</td>
    <td class="col-change">—</td><td class="col-stock"><span class="badge-stock">Visitable</span></td></tr>`;
  });
  if(!rows)rows='<tr><td colspan="7" style="text-align:center;padding:20px;color:#8a7f68">No hay casas disponibles.</td></tr>';
  mainHtml=`<div class="broker-table-wrap"><table class="broker-table"><thead><tr>
   <th></th><th>Casa</th><th>Categoría</th><th>—</th><th>Relación</th><th>—</th><th>Estado</th></tr></thead>
   <tbody>${rows}</tbody></table></div>`;
 } else {
  const items=(currentCat==='ALL'?PRODUCTS.filter(p=>p.unlock<=(S.level||1)):PRODUCTS.filter(p=>p.cat===currentCat&&p.unlock<=(S.level||1))).filter(p=>!q||norm(p.name).includes(q));
  let rows='';
  items.forEach(p=>{
   const stock=S.stock[p.id]||0;
   const buyPrice=mkCost(p.id),sellPrice=priceOf(p.id);
   const prev=S.mkPrev[p.id]||buyPrice;
   const change=prev?((buyPrice-prev)/prev*100):0;
   const changeStr=change>0.1?`<span class="trend-up">▲ +${change.toFixed(1)}%</span>`:change<-0.1?`<span class="trend-down">▼ ${change.toFixed(1)}%</span>`:'<span class="trend-eq">▬ 0.0%</span>';
   const stockLabel=hasSuper?`<span class="badge-stock ${stock>0?'own':''}">${stock}</span>`:'<span class="badge-stock">-</span>';
   rows+=`<tr data-row-kind="product" data-row-id="${p.id}">
    <td class="col-emoji">${p.emoji}</td><td class="col-name">${p.name}</td><td class="col-cat">${CATNAME[p.cat]}</td>
    <td class="col-buy">${fmt$(buyPrice)}</td><td class="col-sell">${fmt$(sellPrice)}</td>
    <td class="col-change">${changeStr}</td><td class="col-stock">${stockLabel}</td></tr>`;
  });
  if(!rows)rows='<tr><td colspan="7" style="text-align:center;padding:20px;color:#8a7f68">No hay productos en esta categoría.</td></tr>';
  mainHtml=`<div class="broker-table-wrap"><table class="broker-table"><thead><tr>
   <th></th><th>Producto</th><th>Categoría</th><th class="col-buy">Precio Compra</th><th class="col-sell">Precio Venta</th><th class="col-change">Cambio 24h</th><th class="col-stock">Stock</th></tr></thead>
   <tbody>${rows}</tbody></table></div>`;
 }
 $('brokerMain').innerHTML=mainHtml;

 $('brokerNote').innerHTML=isLandCat
  ?'🏗️ Compra terrenos y edificios para tu ciudad.<br>👆 Elige un tipo y pulsa Comprar en la tarjeta que te interesa.'
  :(S.mode==='online'?'🌐 Modo Online-Multijugador: comercia con otros jugadores y la red en tiempo real.<br>👆 Haz clic en cualquier fila para ver más información.':'🤖 Modo Offline-CPU: la computadora genera pedidos y lotes para negociar.<br>👆 Haz clic en cualquier fila para ver más información.');

 renderOffers();

 $('brokerCategories').querySelectorAll('.cat-item').forEach(el=>{
  el.onclick=()=>{brokerCurrentCategory=el.dataset.cat;brokerLandType='ALL';renderBroker();};
 });
 $('brokerMain').querySelectorAll('[data-land-type]').forEach(el=>{
  el.onclick=()=>{brokerLandType=el.dataset.landType;renderBroker();};
 });
 $('brokerMain').querySelectorAll('[data-buy-land]').forEach(b=>{
  b.onclick=e=>{e.stopPropagation();const item=landById[b.dataset.buyLand];if(!item)return;
   if(S.wallet<item.price){toast('💼 No te llega la cartera.');return;}
   S.wallet-=item.price;S.landBuildings[item.id]=(S.landBuildings[item.id]||0)+1;
   logEconomy('Terrenos',`Compra de ${item.name}`,item.price,'Broker');
   toast(`✅ ${item.name} adquirido por ${fmtEuroInt(item.price)}.`);save();updateHUD();renderBroker();};
 });
 $('brokerMain').querySelectorAll('tr[data-row-kind]').forEach(row=>{
  row.onclick=()=>openDetail(row.dataset.rowKind,row.dataset.rowId);
 });
}

function renderOffers(){
 if(brokerCurrentCategory==='_terrenos'){$('offersWrap').innerHTML='';return;}
 const offersHtml=(S.offers||[]).length?S.offers.map(o=>{
  const p=byId[o.pid];if(!p)return'';
  return `<div class="orow"><span>${o.emoji||'🤝'} <b>${o.name}</b> ofrece ${o.qty}× ${p.emoji} ${p.name} · ${fmt$(o.price)}</span>
   <button class="btn grn" data-buyoffer="${o.id}" ${S.cash>=o.price?'':'disabled'}>Comprar lote</button></div>`;
 }).join(''):'<p style="font-size:.86rem;color:#8a7f68">Todavía no hay lotes publicados.</p>';
 $('offersWrap').innerHTML=`<div class="sect" style="margin-top:12px"><h4>🤝 Ofertas de otros comerciantes</h4><div>${offersHtml}</div></div>`;
 $('offersWrap').querySelectorAll('[data-buyoffer]').forEach(b=>{
  b.onclick=()=>buyOfferLocal(b.dataset.buyoffer);
 });
}

function buyOfferLocal(id){
 const o=(S.offers||[]).find(x=>x.id===id);if(!o)return;
 if((S.cash||0)<o.price){toast('🏪 La caja no llega.');return;}
 if(o.qty>cap()-totalStock()){toast('📦 Almacén lleno.');return;}
 S.cash-=o.price;addStock(o.pid,o.qty);S.offers=S.offers.filter(x=>x.id!==id);
 logEconomy('Broker',`Compra de lote: ${o.qty} unidades de ${byId[o.pid].name}`,o.price,o.name);
 toast(`🤝 Lote comprado a ${o.name}: ${o.qty}× ${byId[o.pid].name}`);
 save();updateHUD();renderBroker();
}

/* ===== Modal de detalle ===== */
function openDetail(kind,id){
 const card=$('detailCard');
 let h='';
 if(kind==='product'){
  const p=byId[+id];if(!p)return;
  const stock=S.stock[p.id]||0,price=mkCost(p.id);
  h=`<h2>${p.emoji} ${p.name}</h2>
   <p><b>${CATNAME[p.cat]}</b> · Precio de mercado: ${fmt$(price)}/ud · Precio justo: ${fmt$(p.fair)}</p>
   <div class="sect"><h4>📊 Detalles</h4>
    <div class="orow"><span>Demanda</span><span>${'★'.repeat(Math.min(5,Math.round(p.pop/2)))}</span></div>
    <div class="orow"><span>Cantidad en tu súper</span><span><b>${stock} uds.</b></span></div>
    ${S.contracts[p.cat]?`<div class="orow"><span>Contrato activo</span><span>−${6*S.contracts[p.cat]}%</span></div>`:''}
   </div>
   <div class="sect"><h4>🛒 Compra directa</h4>
    <div class="rowflex" id="detailQchips"></div>
    <div class="rowflex" style="margin-top:8px">
     <button class="btn grn" id="detailBuyBtn">Comprar ×${buyQty}</button>
     <button class="btn" id="detailFillBtn" title="Llenar">∞ Llenar</button>
    </div>
   </div>`;
 } else if(kind==='est'){
  const e=START_ESTABLISHMENTS.find(x=>x.id===id);if(!e)return;
  const own=(S.properties||[]).includes(e.id);
  h=`<h2>${own?'✅':'🏢'} ${e.name}</h2>
   <p><b>${e.type}</b> · ${own?'Propiedad tuya':'Disponible para comprar'}</p>
   <div class="sect"><h4>ℹ️ Información</h4>
    <div class="orow"><span>Precio de compra</span><span>${fmt$(e.cost)}</span></div>
    <div class="orow"><span>Valor estimado de venta</span><span>${fmt$(Math.round(e.cost*.7))}</span></div>
    <div class="orow"><span>Ubicación</span><span>Valencia</span></div>
   </div>
   <div class="sect"><h4>${own?'Gestión':'Operación'}</h4>
    ${own?`<button class="btn red" id="sellEstBtn">💸 Vender por ${fmt$(Math.round(e.cost*.7))}</button>`
         :`<button class="btn grn" id="buyEstBtn" ${S.wallet<e.cost?'disabled':''}>🏷️ Comprar por ${fmt$(e.cost)}</button>`}
   </div>`;
 } else if(kind==='house'){
  const b=BOTS.find(x=>x.id===id);if(!b)return;
  h=`<h2>🏠 ${b.emoji} Casa de ${b.name}</h2>
   <p>Vecino del barrio · Relación: ${relOf(b)}</p>
   <div class="sect"><h4>👋 Interacción</h4>
    <button class="btn" id="greetBtn" ${S.greeted[b.id]?'disabled':''}>${S.greeted[b.id]?'✅ Ya le has saludado hoy':'👋 Saludar (+3 relación)'}</button>
    <p style="font-size:.85rem;margin-top:6px">Mejor relación = mejores precios en pedidos. Visítalo desde el mapa principal para chatear.</p>
   </div>`;
 }
 card.innerHTML=h+`<div style="text-align:right;margin-top:8px"><button class="btn ghost" id="closeDetailBtn">Cerrar ✖</button></div>`;
 $('detailModal').classList.add('open');

 if(kind==='product'){
  const p=byId[+id];
  const qc=$('detailQchips');
  [10,50,200,500].forEach(qv=>{
   const bt=document.createElement('button');bt.className='qchip'+(qv===buyQty?' sel':'');bt.textContent='×'+qv;
   bt.onclick=()=>{buyQty=qv;qc.querySelectorAll('.qchip').forEach(x=>x.classList.remove('sel'));bt.classList.add('sel');$('detailBuyBtn').textContent='Comprar ×'+buyQty;};
   qc.appendChild(bt);
  });
  $('detailBuyBtn').onclick=()=>{if(buy(p.id,buyQty,false)){openDetail('product',id);renderBroker();}};
  $('detailFillBtn').onclick=()=>{if(buy(p.id,0,true)){openDetail('product',id);renderBroker();}};
 }
 if(kind==='est'){
  const e=START_ESTABLISHMENTS.find(x=>x.id===id);
  $('buyEstBtn')?.addEventListener('click',()=>{
   if(S.wallet<e.cost){toast('💼 No te llega la cartera.');return;}
   S.wallet-=e.cost;S.properties.push(e.id);
   logEconomy('Locales',`Compra de ${e.name}`,e.cost,'Broker');
   toast(`✅ ${e.name} ya es tuyo.`);save();updateHUD();$('detailModal').classList.remove('open');renderBroker();
  });
  $('sellEstBtn')?.addEventListener('click',()=>{
   const value=Math.round(e.cost*.7);S.properties=S.properties.filter(x=>x!==e.id);S.wallet+=value;
   logEconomy('Locales',`Venta de ${e.name}`,value,'Broker');
   toast(`💰 Venta: +${fmt$(value)}`);save();updateHUD();$('detailModal').classList.remove('open');renderBroker();
  });
 }
 if(kind==='house'){
  const b=BOTS.find(x=>x.id===id);
  $('greetBtn')?.addEventListener('click',()=>{
   if(S.greeted[b.id])return;
   S.greeted[b.id]=1;S.rel[b.id]=(S.rel[b.id]||0)+3;
   toast(`👋 Saludaste a ${b.name}`);save();openDetail('house',id);renderBroker();
  });
 }
 $('closeDetailBtn').onclick=()=>$('detailModal').classList.remove('open');
}
$('detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal')$('detailModal').classList.remove('open');});

/* ===== Chips de cantidad y búsqueda globales ===== */
(function(){
 const qc=$('qchips');
 [10,50,200,500].forEach(qv=>{
  const b=document.createElement('button');b.className='qchip'+(qv===buyQty?' sel':'');b.textContent='×'+qv;
  b.onclick=()=>{buyQty=qv;qc.querySelectorAll('.qchip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
  qc.appendChild(b);
 });
})();
$('searchM').addEventListener('input',renderBroker);

setInterval(()=>{S=loadState()||S;updateHUD();},5000);
updateHUD();renderBroker();
</script>
</body>
</html>
