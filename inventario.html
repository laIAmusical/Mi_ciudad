:root{--bg:#0f2f22;--paper:#fdf7ea;--paper2:#f2e7cd;--ink:#26221c;--red:#d93a2b;--red2:#a92417;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow Semi Condensed',sans-serif;color:var(--ink);background:
 radial-gradient(1200px 500px at 50% -10%,#1b4a35 0%,transparent 60%),
 repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 2px,transparent 2px 26px),var(--bg);
 min-height:100vh;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}button{font-family:inherit;cursor:pointer;user-select:none}
.btn{border:2px solid var(--shadow);border-radius:8px;padding:6px 12px;font-weight:700;font-size:.88rem;
 box-shadow:0 3px 0 var(--shadow);transition:transform .1s;background:var(--yellow)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn.red{background:var(--red);color:#fff}.btn.ghost{background:#fff}.btn.grn{background:var(--green);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.toast{background:var(--shadow);color:#fff;padding:9px 18px;border-radius:10px;border:2px solid var(--yellow);font-weight:600;animation:pop .25s;max-width:92vw;text-align:center}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;align-items:center}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.topbar{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
 padding:8px 12px;background:linear-gradient(#0c281c,#0a2217);border-bottom:3px solid #1d5a41}
.chip{background:#12382a;border:2px solid #1d5a41;color:#e9f5ec;border-radius:10px;padding:5px 11px;font-size:.92rem;
 display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.chip b{color:#fff}
.mini{width:64px;height:9px;background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.mini i{display:block;height:100%;transition:width .4s}
#tbEnergy i{background:linear-gradient(90deg,#ffb347,var(--yellow))}
.mcard{position:relative;z-index:10001;background:var(--paper);border:3px solid var(--shadow);border-radius:14px;max-width:900px;width:100%;padding:22px;
 box-shadow:0 10px 0 var(--shadow),0 24px 50px rgba(0,0,0,.5);animation:pop .3s;max-height:92vh;overflow-y:auto;margin:20px auto}
.mcard h2{font-family:'Bungee';color:var(--red);font-size:1.35rem;margin-bottom:8px}
.mcard p{margin-bottom:8px;line-height:1.35}
.sect{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.sect h4{font-family:'Bungee';font-size:.9rem;color:var(--red);margin-bottom:6px}
.orow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding:6px 0;font-size:.9rem;flex-wrap:wrap}
.orow:last-child{border:none}
.empty-log{text-align:center;background:#fff3cd;border:2px dashed #e6b31e;border-radius:9px;padding:16px;color:#6b6250;font-size:.86rem}
.inventory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.inventory-card{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.inventory-card h3{font-family:'Bungee';color:var(--red);font-size:.85rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.inventory-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #d8cdb7;padding:5px 0;font-size:.85rem}
.inventory-row:last-child{border:0}
.inventory-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.inventory-actions .btn{flex:1 1 140px}
.origin-detail{background:#fff3cd;border:2px dashed #e6b31e;border-radius:9px;padding:9px 12px;font-size:.85rem;line-height:1.35;margin-bottom:10px}
.summary-card{grid-column:1/-1}
.job-card{background:#fff3cd;border:1px dashed #e6b31e;border-radius:8px;padding:8px 10px;margin-bottom:6px}
.job-card .jt{font-weight:700;font-size:.86rem}
.job-card .jm{font-size:.76rem;color:#6b6250;margin-top:2px}
.job-card .js{font-family:'Bungee';font-size:.85rem;color:#1e9e50;margin-top:4px}
@media(max-width:600px){.inventory-grid{grid-template-columns:1fr}}

 document.getElementById('tbWallet').textContent='€'+S.wallet.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
 document.getElementById('tbEnergy').firstElementChild.style.width=(S.energy||100)+'%';
 document.getElementById('tbMood').textContent=(S.mood||70)>=80?'😄':(S.mood||70)>=55?'😊':(S.mood||70)>=30?'😐':(S.mood||70)>=15?'😟':'😭';
 document.getElementById('tbDay').textContent=S.day||1;
 const h=Math.floor((S.clockMin||0)/60),m=(S.clockMin||0)%60;
 document.getElementById('tbClock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
 document.getElementById('tbMode').textContent=S.mode==='online'?'🌐 Online':'🤖 Offline';
}

function renderInventory(){
 const products=Object.entries(S.stock||{}).filter(([,q])=>q>0).map(([id,q])=>{
   const p=byId[id]; if(!p) return '';
   return `<div class="inventory-row"><span>${p.emoji} ${p.name}</span><b>${q} uds.</b></div>`;
 }).join('')||'<div class="empty-log">No tienes artículos almacenados. Compra mercancía en Mercado.</div>';

 const props=(S.properties||[]).map(id=>{
   const e=START_ESTABLISHMENTS.find(x=>x.id===id);
   return e?`<div class="inventory-row"><span>${e.emoji} ${e.name}</span><b>Propio</b></div>`:'';
 }).join('')||'<div class="empty-log">Todavía no tienes establecimientos propios.</div>';

 const landEntries=Object.entries(S.landBuildings||{}).filter(([,q])=>q>0);
 const lands=landEntries.map(([id,q])=>`<div class="inventory-row"><span>🏗️ ${landName(id)}</span><b>${q} uds.</b></div>`)
   .join('')||'<div class="empty-log">No has comprado ningún terreno o edificio en el mercado.</div>';
 const landCount=landEntries.reduce((a,[,q])=>a+q,0);

 const homes=Object.entries(S.houseUp||{}).filter(([,v])=>v).map(([k])=>
   `<div class="inventory-row"><span>${HOUSE_UP_NAMES[k]||('🏠 Mejora: '+k)}</span><b>Instalada</b></div>`
 ).join('')||'<div class="empty-log">No hay mejoras de vivienda.</div>';

 const ownedNodes=Object.keys(S.ownedNodes||{}).filter(k=>S.ownedNodes[k]);
 const nodesOwn=ownedNodes.map(id=>`<div class="inventory-row"><span>🟩 Nodo ${id}</span><b>Propio</b></div>`)
   .join('')||'<div class="empty-log">No tienes nodos propios.</div>';

 const rentedNodes=Object.keys(S.rentedNodes||{}).filter(k=>S.rentedNodes[k]);
 const nodesRent=rentedNodes.map(id=>`<div class="inventory-row"><span>🟡 Nodo ${id}</span><b>Alquilado</b></div>`)
   .join('')||'<div class="empty-log">No tienes nodos alquilados.</div>';

 const jobs=(S.jobs||[]);
 const jobsHtml=jobs.map(j=>`
   <div class="job-card">
    <div class="jt">${j.emoji||'💼'} ${j.title}</div>
    <div class="jm">📍 ${j.place} · empleado desde el día ${j.hiredDay}</div>
    <div class="jm">Próxima nómina: día ${j.lastPaidDay+30}</div>
    <div class="js">${fmt$(j.salary)} / mes</div>
   </div>
 `).join('')||'<div class="empty-log">No tienes ningún empleo fijo. Firma un contrato de trabajo en un local con 👷.</div>';

 const supplierEntries=Object.entries(S.contracts||{}).filter(([,lv])=>lv>0);
 const supplierHtml=supplierEntries.map(([cat,lv])=>
   `<div class="inventory-row"><span>${CATNAME[cat]||cat} — descuento ${6*lv}%</span><b>Nivel ${lv}/3</b></div>`
 ).join('')||'<div class="empty-log">No has firmado contratos de proveedor.</div>';

 const supplyList=(S.supplyContracts||[]).filter(c=>c.active);
 const supplyHtml=supplyList.map(c=>
   `<div class="inventory-row"><span>${c.from} → ${c.to} · ${c.qty} uds · ${fmt$(c.pricePerUnit)}/ud</span><b>${c.daysLeft} días</b></div>`
 ).join('')||'<div class="empty-log">No hay contratos de suministro activos en la plaza.</div>';

 const vanLv=S.vanLv||0;
 const vanHtml=vanLv>0
   ? `<div class="inventory-row"><span>🚚 Furgonetas de reparto</span><b>Nivel ${vanLv}/3</b></div>
      <div class="inventory-row"><span>⛽ Repostaje de hoy</span><b>${S.fuelToday?'Hecho':'Pendiente'}</b></div>`
   : '<div class="empty-log">No tienes furgonetas de reparto.</div>';

 const hasSuper=(S.properties||[]).some(id=>id==='est09');
 document.getElementById('inventorySummary').innerHTML =
   `Tus artículos, edificios, locales, mejoras y actividad. Cartera: <b>${fmt$(S.wallet||0)}</b> · Caja del súper: ${hasSuper?`<b>${fmt$(S.cash||0)}</b>`:'<b>Bloqueada</b> (adquiere un supermercado)'}`;

 document.getElementById('inventoryGrid').innerHTML = `
  <section class="inventory-card"><h3>🛒 Artículos comprados</h3>${products}</section>
  <section class="inventory-card"><h3>📌 Establecimientos</h3>${props}</section>
  <section class="inventory-card"><h3>💼 Empleos (sueldo mensual)</h3>${jobsHtml}</section>
  <section class="inventory-card"><h3>🤝 Contratos de proveedor</h3>${supplierHtml}</section>
  <section class="inventory-card"><h3>📄 Contratos de suministro (plaza)</h3>${supplyHtml}</section>
  <section class="inventory-card"><h3>🏗️ Terrenos y edificios (${landCount})</h3>${lands}</section>
  <section class="inventory-card"><h3>🏠 Casas y mejoras</h3>${homes}</section>
  <section class="inventory-card"><h3>🚚 Flota de reparto</h3>${vanHtml}</section>
  <section class="inventory-card"><h3>🟩 Nodos propios (${ownedNodes.length})</h3>${nodesOwn}</section>
  <section class="inventory-card"><h3>🟡 Nodos alquilados (${rentedNodes.length})</h3>${nodesRent}</section>
  <section class="inventory-card summary-card"><h3>📦 Resumen del negocio</h3>
   <div class="inventory-row"><span>Stock total</span><b>${Object.values(S.stock||{}).reduce((a,b)=>a+b,0)} uds.</b></div>
   <div class="inventory-row"><span>Capacidad</span><b>${250+(S.up?.shelf||0)*150+(S.vanLv||0)*40} uds.</b></div>
   <div class="inventory-row"><span>Nivel</span><b>${S.level||1}</b></div>
   <div class="inventory-row"><span>Reputación</span><b>${(S.rep||3).toFixed(1)}/5</b></div>
   <div class="inventory-row"><span>Empleos activos</span><b>${jobs.length}</b></div>
  </section>
 `;
}

setInterval(()=>{S=loadState()||S;updateHUD();renderInventory();},5000);
updateHUD();renderInventory();
</script>
</body>
</html>
