.panelhead{background:var(--paper);border:2px solid var(--shadow);border-radius:12px 12px 0 0;padding:12px 16px 8px}

.panelhead p{font-size:.88rem;color:#6b6250;margin-top:4px;line-height:1.35}
.panelbody{background:var(--paper);border:2px solid var(--shadow);border-top:1px dashed var(--line);border-radius:0 0 12px 12px;padding:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}

.qchip.sel{background:var(--yellow)}
.emptybox{padding:28px;text-align:center;color:#8a7f68;background:#fff;border:2px dashed var(--line);border-radius:12px}
.toast{background:var(--shadow);color:#fff;padding:9px 18px;border-radius:10px;border:2px solid var(--yellow);font-weight:600;animation:pop .25s;max-width:92vw;text-align:center}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;align-items:center}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.topbar{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
 padding:8px 12px;background:linear-gradient(#0c281c,#0a2217);border-bottom:3px solid #1d5a41}

.mini{width:64px;height:9px;background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.mini i{display:block;height:100%;transition:width .4s}
#tbEnergy i{background:linear-gradient(90deg,#ffb347,var(--yellow))}

 $('tbDay').textContent=S.day||1;

 $('tbClock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
 $('tbMode').textContent=S.mode==='online'?'🌐 Online-Multijugador':'🤖 Offline-CPU';
}

 {id:'lb90',name:'Lanzadera Espacial',type:'Transport',size:800,produce:'500 Turismo',desc:'Conecta tu ciudad con el espacio y el turismo interplanetario.',price:50000}
];
const landById=Object.fromEntries(LAND_BUILDINGS.map(b=>[b.id,b]));

let brokerLandType='ALL';
let buyQty=50;

function renderLandGrid(){
 const q=norm($('searchM').value||'');
 const landType=brokerLandType||'ALL';
 const landTypesPresent=[...new Set(LAND_BUILDINGS.map(b=>b.type))];
 let typeBar=`<div class="lc-btn${landType==='ALL'?' active':''}" data-land-type="ALL">📋 Todos</div>`;
 landTypesPresent.forEach(t=>{typeBar+=`<div class="lc-btn${landType===t?' active':''}" data-land-type="${t}">${LAND_ICONS[t]||'🏗️'} ${translateType(t)}</div>`;});
 $('landTypeBar').innerHTML=typeBar;

 const items=(landType==='ALL'?LAND_BUILDINGS:LAND_BUILDINGS.filter(b=>b.type===landType)).filter(b=>!q||norm(b.name).includes(q));
 const cards=items.map(b=>{
  const owned=(S.landBuildings&&S.landBuildings[b.id])||0;
  const canAfford=S.wallet>=b.price;
  return `<div class="land-card">
   <h3>${LAND_ICONS[b.type]||'🏗️'} ${b.name}</h3>
   <div class="land-meta">Tipo: ${translateType(b.type)}</div>
   <div class="land-meta">Tamaño: ${b.size} m²</div>
   <div class="land-produce">${b.produce?('Produce: '+b.produce):'No produce directamente.'}</div>
   <div class="land-desc">${b.desc}</div>
   <div class="land-price">Precio: ${fmtEuroInt(b.price)}</div>
   ${owned?`<span class="land-owned">✅ Tienes: ${owned}</span>`:''}
   <button class="btn" data-buy-land="${b.id}" ${canAfford?'':'disabled'}>${canAfford?'🏷️ Comprar':'💼 Sin cartera'}</button>
  </div>`;
 }).join('');
 $('landGrid').innerHTML=cards||'<div class="emptybox">No hay terrenos o edificios en esta categoría.</div>';

 $('landTypeBar').querySelectorAll('[data-land-type]').forEach(el=>{
  el.onclick=()=>{brokerLandType=el.dataset.landType;renderLandGrid();};
 });
 $('landGrid').querySelectorAll('[data-buy-land]').forEach(btn=>{
  btn.onclick=e=>{
   e.stopPropagation();
   const item=landById[btn.dataset.buyLand];if(!item)return;
   if(S.wallet<item.price){toast('💼 No te llega la cartera.');return;}
   S.wallet-=item.price;
   S.landBuildings[item.id]=(S.landBuildings[item.id]||0)+1;
   logEconomy('Terrenos',`Compra de ${item.name}`,item.price,'Broker');
   toast(`✅ ${item.name} adquirido por ${fmtEuroInt(item.price)}.`);
   save();updateHUD();renderLandGrid();
  };
 });
}

$('searchM').addEventListener('input',renderLandGrid);
setInterval(()=>{S=loadState()||S;updateHUD();},5000);
updateHUD();renderLandGrid();
</script>
</body>
</html>
